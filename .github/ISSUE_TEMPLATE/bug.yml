name: Bug report
description: Something broke or did not do what it said.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not go here. Use the Security tab (see SECURITY.md).
        Do not paste file names or paths you consider private.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what MacPat did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Clean module
        2. Click Scan
        3. ...
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
  - type: input
    id: macpat
    attributes:
      label: MacPat version
      description: The version in About, or the tag you built from.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: How you run MacPat
      options:
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or the action log
      description: Paste only what you are comfortable sharing. Check it for file names first.
      render: text
